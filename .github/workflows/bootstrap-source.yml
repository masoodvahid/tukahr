name: Bootstrap Source

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 -d > /tmp/tukahr-source.tar.xz
          test "$(wc -c < /tmp/tukahr-source.tar.xz)" -eq 29464
          tar -xJf /tmp/tukahr-source.tar.xz

      - name: Commit real project source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .github/workflows/bootstrap-source.yml
          git config user.name "TukaHR Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement TukaHR payroll workflow"
          git push origin HEAD:develop
