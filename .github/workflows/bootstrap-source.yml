name: Bootstrap Source

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 -d > /tmp/tukahr-source.tar.xz
          test "$(wc -c < /tmp/tukahr-source.tar.xz)" -eq 29464
          tar -xJf /tmp/tukahr-source.tar.xz
          rm -f .github/workflows/ci.yml

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TukaHR Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app artisan bootstrap composer.json config database package.json phpunit.xml public resources routes tests vite.config.js .env.example .gitignore README.md SECURITY.md
          git commit -m "feat: implement TukaHR payroll workflow"
          git push origin develop
